services:
  postgres:
    image: postgres:16
    container_name: ai-usage-guard-postgres
    environment:
      POSTGRES_DB: ai_usage_guard_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ai-usage-guard-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_usage_guard_dev"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-usage-guard-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Database__Provider: Postgres
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=ai_usage_guard_dev;Username=postgres;Password=postgres
    ports:
      - "5172:8080"

volumes:
  ai-usage-guard-postgres-data:
